<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="IPTV Play - Smart IPTV Player">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="IPTV Play">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>IPTV Play</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    window.iptvStore = {
      db: null,
      async init() {
        if (this.db) return this.db;
        return new Promise((resolve, reject) => {
          const req = indexedDB.open('iptv_cache_db', 1);
          req.onupgradeneeded = () => {
            if (!req.result.objectStoreNames.contains('catalogs')) {
              req.result.createObjectStore('catalogs');
            }
          };
          req.onsuccess = () => { this.db = req.result; resolve(this.db); };
          req.onerror = () => reject(req.error);
        });
      },
      async set(key, value) {
        const db = await this.init();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('catalogs', 'readwrite');
          tx.objectStore('catalogs').put(value, key);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error);
        });
      },
      async get(key) {
        const db = await this.init();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('catalogs', 'readonly');
          const req = tx.objectStore('catalogs').get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(req.error);
        });
      },
      async remove(key) {
        const db = await this.init();
        return new Promise((resolve, reject) => {
          const tx = db.transaction('catalogs', 'readwrite');
          tx.objectStore('catalogs').delete(key);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error);
        });
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
